models:
  compaction-mock:
    model_url: "http://127.0.0.1:__MOCK_LLM_PORT__/v1"
    model_name: "openai/compaction-mock"
    api_key: "mock"
    description: "Scripted mock model for empty checkpoint recovery (issue #1138)"
    supports_tools: true
    # A small window so a handful of turns reaches the compaction threshold.
    context_window: 6000
    max_tokens: 400
  reasoning-mock:
    model_url: "http://127.0.0.1:__MOCK_LLM_PORT__/v1"
    model_name: "openai/reasoning-mock"
    api_key: "mock"
    description: "The same mock, configured with a reasoning effort"
    supports_tools: true
    context_window: 6000
    max_tokens: 400
    reasoning_effort: "low"
