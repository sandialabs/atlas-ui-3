# Issue #1227: one static model plus one team-scoped Enterprise LiteLLM
# gateway. Launch discovery must offer the gateway's team models alongside
# the static one. __MOCK_LITELLM_PORT__ is substituted by the validation script.
models:
  static-model:
    model_name: openai/gpt-4o
    model_url: "http://127.0.0.1:__MOCK_LITELLM_PORT__"
    api_key: "sk-unused"
litellm_gateways:
  enterprise:
    base_url: "http://127.0.0.1:__MOCK_LITELLM_PORT__"
    api_key: "sk-mock-litellm-master"
    display_name: "Enterprise LiteLLM"
    description: "Team-scoped models on the mock proxy"
