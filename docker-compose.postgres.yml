# Optional bundled PostgreSQL for chat history (issue #1052).
#
# Include it when chat history should run on PostgreSQL instead of DuckDB:
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# and point CHAT_HISTORY_DB_URL at it in your environment or .env, keeping the
# same password (URL-encode special characters):
#
#   POSTGRES_PASSWORD=...
#   CHAT_HISTORY_DB_URL=postgresql://atlas:<POSTGRES_PASSWORD>@postgres:5432/atlas_chat_history
#
# The file is self-contained, so it can also start PostgreSQL alone for a
# host-run Atlas (agent_start.sh does this automatically when
# CHAT_HISTORY_DB_URL is a postgresql:// URL):
#
#   docker compose -f docker-compose.postgres.yml up -d postgres
#
# The password is required and fails closed: configuration refuses to render
# when POSTGRES_PASSWORD is missing or empty, and no default password ships.
# DuckDB deployments never need this file or that variable.
services:
  postgres:
    image: docker.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: atlas-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment or .env}
      POSTGRES_DB: atlas_chat_history
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_chat_history"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network

networks:
  atlas-network:
    driver: bridge

volumes:
  postgres-data:
