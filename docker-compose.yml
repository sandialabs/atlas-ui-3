# Local development only. Never expose this stack directly to an untrusted network.
# Public deployments require an authenticated reverse proxy and operator-managed storage.
#
# This base stack starts only the Atlas application, against your own object
# storage (S3_ENDPOINT / S3_ACCESS_KEY / S3_SECRET_KEY below) and DuckDB chat
# history, which needs no database credentials. Bundled MinIO and PostgreSQL
# are opt-in through additional Compose files, so you are never asked for the
# credentials of services you do not run (issue #1052):
#
#   bundled MinIO:      docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d
#   bundled PostgreSQL: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# Credentials are enforced at configuration time and fail closed: Compose
# refuses to render a stack whose included services are missing a secret, and
# no shipped default passwords or placeholder secrets exist.
services:
  atlas-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: "Chat UI"
    container_name: atlas-ui-3
    labels:
      org.atlas.deployment: development-only
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Core / Development
      - PORT=8000
      - APP_NAME=ATLAS
      - ATLAS_HOST=0.0.0.0  # Required for Docker container to accept external connections
      - ENVIRONMENT=development
      
      # API Keys for LLM services
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      
      # Banner system configuration
      - BANNER_ENABLED=true
      
      # Log level configuration
      - LOG_LEVEL=INFO
      # Suppress LiteLLM verbose logging
      - FEATURE_SUPPRESS_LITELLM_LOGGING=true

      # Feature Flags
      - FEATURE_WORKSPACES_ENABLED=false
      - FEATURE_RAG_ENABLED=false
      - FEATURE_ATLAS_RAG_TOOLS_ENABLED=false
      - FEATURE_TOOLS_ENABLED=true
      - FEATURE_MARKETPLACE_ENABLED=true
      - FEATURE_FILES_PANEL_ENABLED=true
      # Maximum user-uploaded file size in MiB (applies to chat attachments and /api/files uploads)
      - MAX_FILE_UPLOAD_SIZE_MB=250
      - FEATURE_CHAT_HISTORY_ENABLED=true
      # Per-user custom prompt library (requires chat history)
      - FEATURE_CUSTOM_PROMPTS_ENABLED=false
      # Parallel conversation runs (issue #884). Applies to agent-mode turns
      # saved to the server; see docs/admin/parallel-conversation-runs.md.
      # Counts every run that has not finished, including one paused on a tool
      # approval.
      - MAX_CONCURRENT_RUNS_PER_USER=5
      # Hard limit on a single run's execution time; 0 disables it.
      - MAX_RUN_WALL_CLOCK_SECONDS=3600
      # Wait for a tool approval / elicitation response. 0 waits indefinitely,
      # which is what lets an approval survive the browser being closed.
      - TOOL_APPROVAL_TIMEOUT_SECONDS=300
      # Session store: "memory" (process-local, default) or a custom type
      # registered in atlas.infrastructure.sessions.factory (issue #760)
      - SESSION_REPOSITORY_TYPE=memory
      # Chat history DB. Hard-coded, not environment-interpolated on purpose:
      # a host-oriented .env (duckdb:///data/chat_history.db, relative to the
      # project root) must not leak into the container, where only the
      # absolute /data path on the atlas-data volume is writable by the
      # nonroot runtime UID (issue #1052 review). The bundled PostgreSQL file
      # overrides this value with its own atlas-ui overlay; point the stack
      # at a different database with an additional override file.
      - CHAT_HISTORY_DB_URL=duckdb:////data/chat_history.db
      - FEATURE_COMPLIANCE_LEVELS_ENABLED=false
      - FEATURE_COMPLIANCE_LEVEL_REQUIRED=false
      - FEATURE_METRICS_LOGGING_ENABLED=false
      - FEATURE_SPLASH_SCREEN_ENABLED=false
      - FEATURE_DOMAIN_WHITELIST_ENABLED=false
      - FEATURE_MCP_AUTO_RECONNECT_ENABLED=false
      - MCP_DISCOVERY_TIMEOUT=30
      - MCP_CALL_TIMEOUT=120
      - MCP_TASK_TIMEOUT=10
      - MCP_STATE_BACKEND=memory
      # Required: encryption key for per-user MCP token storage (>=32 chars).
      # No default is supplied on purpose - the previous dev-only literal was
      # committed here, so it is public and Atlas now rejects it outright.
      # Set it in your shell or in a .env file beside this compose file:
      #   echo "MCP_TOKEN_ENCRYPTION_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> .env
      # Keep it stable - rotating it invalidates all stored tokens.
      - MCP_TOKEN_ENCRYPTION_KEY=${MCP_TOKEN_ENCRYPTION_KEY:?set MCP_TOKEN_ENCRYPTION_KEY (>=32 chars) in your environment or .env}
      # Store tokens on the writable atlas-data volume; the UID 10001 runtime
      # cannot write the host-owned ./config bind mount (config/secure).
      - MCP_TOKEN_STORAGE_DIR=/data/tokens
      - FEATURE_FILE_CONTENT_EXTRACTION_ENABLED=false
      - FEATURE_GLOBUS_AUTH_ENABLED=false

      # OIDC login (Atlas as an OAuth confidential client). Off by default;
      # the trusted-header auth mode above stays in effect. Enabling it also
      # requires OIDC_ISSUER, OIDC_CLIENT_ID and OIDC_SESSION_SECRET --
      # see docs/admin/oidc-authentication.md.
      - FEATURE_OIDC_AUTH_ENABLED=false
      # Delegated downstream authorization (RFC 8693 / Entra OBO).
      - FEATURE_OIDC_DELEGATION_ENABLED=false

      # Agent mode configuration
      - AGENT_MAX_STEPS=30
      - AGENT_SLEEP_MAX_SECONDS=7200
      - AGENT_SLEEP_MAX_TURN_SECONDS=7200
      - AGENT_DEFAULT_ENABLED=true
      - FEATURE_AGENT_MODE_AVAILABLE=true
      - FEATURE_FOLLOWUP_SUGGESTIONS_ENABLED=false
      - FEATURE_FINETUNE_CAPTURE_ENABLED=false
      
      # Tool approval configuration
      - REQUIRE_TOOL_APPROVAL_BY_DEFAULT=false
      - FORCE_TOOL_APPROVAL_GLOBALLY=false
      
      - APP_LOG_DIR=/app/logs
      
      - CAPABILITY_TOKEN_SECRET=${CAPABILITY_TOKEN_SECRET:?set CAPABILITY_TOKEN_SECRET (>=32 chars) in your environment or .env}

      # Required: the authenticating reverse proxy must present this value as
      # X-Proxy-Secret. Proxy-secret enforcement is on by default and fails
      # closed, so a direct browser hit is rejected until a proxy is in front.
      - PROXY_SECRET=${PROXY_SECRET:?set PROXY_SECRET (>=32 chars) in your environment or .env}
      
      # Object storage (required). This development stack runs against real
      # object storage (USE_MOCK_S3=false) and has no IAM credential chain,
      # so it cannot fall back to anonymous access. With
      # docker-compose.minio.yml included, these credentials are also the
      # bundled MinIO root credentials -- one credential pair for the stack.
      - S3_ENDPOINT=${S3_ENDPOINT:?set S3_ENDPOINT in your environment or .env (use http://minio:9000 with docker-compose.minio.yml)}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-atlas-files}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?set S3_ACCESS_KEY in your environment or .env}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?set S3_SECRET_KEY in your environment or .env}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_SSL=${S3_USE_SSL:-false}
      - USE_MOCK_S3=false
      
      # Content Security Policy (CSP) configuration
      - "SECURITY_CSP_VALUE=default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self' blob: data: https://www.sandia.gov; frame-ancestors 'self'"
    volumes:
      - atlas-logs:/app/logs
      - ./config:/app/config
      - atlas-data:/data
    networks:
      - atlas-network

networks:
  atlas-network:
    driver: bridge

volumes:
  atlas-data:
  atlas-logs:
