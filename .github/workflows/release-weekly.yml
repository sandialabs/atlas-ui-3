name: Release - weekly automated

# Fully automated weekly release. On the schedule it bumps the version,
# opens a release PR, waits for CI, merges it, tags the merge commit, and
# publishes a GitHub Release. The tag triggers quay-publish.yml (container
# images) and the Release triggers pypi-publish.yml (Python package), so a
# single successful run ships both artifacts.
#
# A week with no entries under `## [Unreleased]` is skipped entirely.
# Full runbook: docs/developer/release-process.md

on:
  schedule:
    # Mondays at 14:00 UTC.
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version to release (X.Y.Z). Blank = auto-bump.'
        required: false
        type: string
        default: ''
      bump:
        description: 'Which part to auto-bump when version is blank'
        required: false
        type: choice
        options:
          - minor
          - patch
          - major
        default: minor
      dry_run:
        description: 'Dry run: print the plan and diff, do not push or publish'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-weekly
  cancel-in-progress: false

jobs:
  release:
    name: Cut weekly release
    runs-on: ubuntu-latest
    # Guardrail: scheduled runs only fire on the canonical repository.
    if: github.event_name != 'schedule' || github.repository == 'sandialabs/atlas-ui-3'
    env:
      # A PAT is required for the release PR to trigger CI. With the default
      # GITHUB_TOKEN the PR opens but no pull_request workflows run, and the
      # merge waits for nothing -- the fallback is documented and warned about.
      RELEASE_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      HAS_RELEASE_PAT: ${{ secrets.RELEASE_PAT != '' && 'true' || 'false' }}
      GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Note PAT requirement when unset
        if: env.HAS_RELEASE_PAT != 'true'
        run: |
          echo "::warning::RELEASE_PAT is not configured."
          echo "::warning::A real (non-dry-run) release stops before creating a branch; only dry_run dispatches can proceed."

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ env.RELEASE_TOKEN }}

      - name: Install uv
        # Pinned to a commit SHA so the install step is immutable.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Verify the current version has a release tag
        # A version merged to main but never tagged (for example, a prior run
        # that died between merge and tag) would otherwise be silently skipped:
        # its changelog entries already moved under a released heading, so
        # `[Unreleased]` looks empty and the next run would plan past it.
        shell: bash
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          current="$(python3 scripts/release_bump.py current)"
          if git rev-parse -q --verify "refs/tags/v${current}" >/dev/null; then
            echo "::notice::Current version ${current} is tagged."
          elif [[ "${DRY_RUN}" == "true" ]]; then
            echo "::warning::Version ${current} has no tag v${current}; a real run would stop so it can be published."
          else
            echo "::error::main is at version ${current} but tag v${current} is missing -- a prior release was merged without being tagged. Tag and publish it before the next weekly run."
            exit 1
          fi

      - name: Check for unreleased changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/release_bump.py check
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "changes=true" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "changes=false" >> "$GITHUB_OUTPUT"
              echo "::notice::No entries under '## [Unreleased]' -- skipping this week's release."
              ;;
            *)
              echo "::error::Could not evaluate the changelog (release_bump.py check exit $rc)."
              exit "$rc"
              ;;
          esac

      - name: Stop when there is nothing to release
        if: steps.changes.outputs.changes != 'true'
        run: echo "Nothing to release; exiting without changing anything."

      - name: Require RELEASE_PAT for a real release
        # Tags and Releases created with the default GITHUB_TOKEN do not
        # trigger other workflows, so pypi-publish.yml and quay-publish.yml
        # would never run and the version would be tagged but never shipped.
        if: steps.changes.outputs.changes == 'true' && github.event.inputs.dry_run != 'true' && env.HAS_RELEASE_PAT != 'true'
        run: |
          set -euo pipefail
          echo "::error::RELEASE_PAT is required to publish: with GITHUB_TOKEN the tag and Release would not trigger the publish workflows. Configure RELEASE_PAT (or dispatch with dry_run: true)."
          exit 1

      - name: Compute release metadata
        id: meta
        if: steps.changes.outputs.changes == 'true'
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          current="$(python3 scripts/release_bump.py current)"

          input_version="${INPUT_VERSION:-}"
          bump_kind="${INPUT_BUMP:-minor}"
          if [[ ! "$bump_kind" =~ ^(major|minor|patch)$ ]]; then
            echo "::error::bump input must be major, minor, or patch; got '$bump_kind'"
            exit 1
          fi

          if [[ -n "$input_version" ]]; then
            if ! [[ "$input_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version input must look like X.Y.Z, got '$input_version'"
              exit 1
            fi
            new_version="$input_version"
          else
            new_version="$(python3 scripts/release_bump.py plan --bump "$bump_kind")"
          fi

          if git rev-parse -q --verify "refs/tags/v${new_version}" >/dev/null; then
            echo "::error::Tag v${new_version} already exists; nothing to do."
            exit 1
          fi

          last_tag="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          release_date="$(date -u +%Y-%m-%d)"
          branch="release/v${new_version}"

          {
            echo "current_version=$current"
            echo "new_version=$new_version"
            echo "last_tag=$last_tag"
            echo "release_date=$release_date"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::Planning release ${current} -> ${new_version} (last tag ${last_tag:-none})"

      - name: Apply version bump
        if: steps.changes.outputs.changes == 'true'
        shell: bash
        env:
          NEW_VERSION: ${{ steps.meta.outputs.new_version }}
          RELEASE_DATE: ${{ steps.meta.outputs.release_date }}
        run: |
          set -euo pipefail
          python3 scripts/release_bump.py apply \
            --version "$NEW_VERSION" \
            --date "$RELEASE_DATE"
          uv lock

      - name: Show diff
        if: steps.changes.outputs.changes == 'true'
        run: |
          git --no-pager diff --stat
          git --no-pager diff

      - name: Dry run stops here
        if: steps.changes.outputs.changes == 'true' && github.event.inputs.dry_run == 'true'
        run: echo "::notice::dry_run=true -- not committing, not pushing, not publishing."

      - name: Create release branch
        if: steps.changes.outputs.changes == 'true' && github.event.inputs.dry_run != 'true'
        env:
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            open_prs="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')"
            if [[ "$open_prs" != "0" ]]; then
              echo "::error::Branch $BRANCH already has an open PR; resolve it before retrying."
              exit 1
            fi
            echo "Removing stale branch $BRANCH left by a previous failed run."
            git push origin --delete "$BRANCH"
          fi
          git checkout -b "$BRANCH"

      - name: Commit and push bump
        id: commit
        if: steps.changes.outputs.changes == 'true' && github.event.inputs.dry_run != 'true'
        env:
          BRANCH: ${{ steps.meta.outputs.branch }}
          NEW_VERSION: ${{ steps.meta.outputs.new_version }}
        run: |
          set -euo pipefail
          git config user.name "atlas-release-bot"
          git config user.email "atlas-release-bot@users.noreply.github.com"
          git add atlas/version.py pyproject.toml uv.lock CHANGELOG.md
          git commit -m "chore(release): weekly v${NEW_VERSION}"
          git push --set-upstream origin "$BRANCH"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        id: pr
        if: steps.changes.outputs.changes == 'true' && github.event.inputs.dry_run != 'true'
        env:
          BRANCH: ${{ steps.meta.outputs.branch }}
          NEW_VERSION: ${{ steps.meta.outputs.new_version }}
          OLD_VERSION: ${{ steps.meta.outputs.current_version }}
          RELEASE_DATE: ${{ steps.meta.outputs.release_date }}
        run: |
          set -euo pipefail
          cat > /tmp/release-pr-body.md <<EOF
          Automated weekly release bump for v${NEW_VERSION} (was ${OLD_VERSION}), dated ${RELEASE_DATE}.

          This PR was opened by the release-weekly workflow. It merges itself once CI is green, then tags v${NEW_VERSION} and publishes a GitHub Release. The tag builds the container images (quay-publish.yml) and the Release publishes the Python package (pypi-publish.yml).

          See docs/developer/release-process.md for the runbook.
          EOF
          pr_url="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "release: v${NEW_VERSION}" \
            --body-file /tmp/release-pr-body.md)"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "number=$(basename "$pr_url")" >> "$GITHUB_OUTPUT"

      - name: Wait for checks and merge
        id: merge
        if: steps.changes.outputs.changes == 'true' && github.event.inputs.dry_run != 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
        run: |
          set -euo pipefail
          wait_ok=false
          for attempt in $(seq 1 10); do
            if gh pr checks "$PR" --watch --fail-fast --interval 30 > /tmp/pr-checks.log 2>&1; then
              wait_ok=true
              break
            fi
            if grep -qi "no checks reported" /tmp/pr-checks.log && [[ "$attempt" -lt 10 ]]; then
              echo "No checks registered yet (attempt ${attempt}); waiting 20s..."
              sleep 20
              continue
            fi
            echo "::error::Release PR #$PR checks did not pass; leaving it open for review."
            cat /tmp/pr-checks.log
            exit 1
          done
          if [[ "$wait_ok" != "true" ]]; then
            echo "::error::Timed out waiting for checks on PR #$PR."
            exit 1
          fi
          # Pin the merge to the exact commit whose checks we just watched, so a
          # commit pushed to the branch after the checks cannot slip through.
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$HEAD_SHA"

          merge_sha=""
          for attempt in $(seq 1 10); do
            merge_sha="$(gh pr view "$PR" --json mergeCommit --jq '.mergeCommit.oid // empty' 2>/dev/null || true)"
            [[ -n "$merge_sha" ]] && break
            sleep 6
          done
          if [[ -z "$merge_sha" ]]; then
            echo "::error::Could not read the merge commit for PR #$PR; refusing to tag."
            exit 1
          fi
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "::notice::Merged PR #$PR as ${merge_sha}"

      - name: Tag the merged commit
        if: steps.changes.outputs.changes == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NEW_VERSION: ${{ steps.meta.outputs.new_version }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          # Tag the exact merge commit, never the moving tip of main: a PR that
          # lands between the merge and the fetch must not be published under
          # this version.
          if ! git cat-file -e "${MERGE_SHA}^{commit}" 2>/dev/null; then
            git fetch origin "$MERGE_SHA" 2>/dev/null || git fetch origin main
          fi
          if ! git cat-file -e "${MERGE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Merge commit ${MERGE_SHA} is not available locally; refusing to tag."
            exit 1
          fi
          remote_version="$(git show "${MERGE_SHA}:atlas/version.py" | grep '^VERSION' | cut -d'"' -f2)"
          if [[ "$remote_version" != "$NEW_VERSION" ]]; then
            echo "::error::Merge commit ${MERGE_SHA} is at version ${remote_version}, expected ${NEW_VERSION}; tag aborted."
            exit 1
          fi
          git tag -a "v${NEW_VERSION}" -m "Atlas UI 3 v${NEW_VERSION}" "$MERGE_SHA"
          git push origin "v${NEW_VERSION}"

      - name: Publish GitHub Release
        if: steps.changes.outputs.changes == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NEW_VERSION: ${{ steps.meta.outputs.new_version }}
        run: |
          set -euo pipefail
          python3 scripts/release_bump.py notes --version "$NEW_VERSION" > /tmp/release-notes.md
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --verify-tag \
            --notes-file /tmp/release-notes.md

      - name: Summary
        if: always()
        env:
          CHANGES: ${{ steps.changes.outputs.changes }}
          OLD: ${{ steps.meta.outputs.current_version }}
          NEW: ${{ steps.meta.outputs.new_version }}
          LAST_TAG: ${{ steps.meta.outputs.last_tag }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          DRY: ${{ github.event.inputs.dry_run }}
          HAS_PAT: ${{ env.HAS_RELEASE_PAT }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Weekly release summary"
            echo ""
            echo "- Unreleased changes: \`${CHANGES:-unknown}\`"
            echo "- Version: \`${OLD:-n/a}\` -> \`${NEW:-n/a}\`"
            echo "- Previous tag: \`${LAST_TAG:-none}\`"
            echo "- Dry run: \`${DRY:-false}\`"
            echo "- RELEASE_PAT configured: \`$HAS_PAT\`"
            echo "- Job status: \`$JOB_STATUS\`"
            echo ""
            if [[ "$CHANGES" != "true" ]]; then
              echo "No entries under \`## [Unreleased]\` -- this week's release was skipped."
            elif [[ "$DRY" == "true" ]]; then
              echo "Dry run only -- nothing was pushed or published."
            elif [[ "$JOB_STATUS" != "success" ]]; then
              echo "Run ended with status \`$JOB_STATUS\` before the release completed. Nothing is claimed as published. If the bump PR was merged but not tagged, tag its merge commit manually before the next run."
            else
              echo "Tag \`v${NEW}\` pushed on \`${MERGE_SHA:-the merge commit}\` and GitHub Release published. Watch pypi-publish.yml and quay-publish.yml for the artifacts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
