# Optional bundled MinIO for the development stack (issue #1052).
#
# Include it only when Atlas should store files in this bundled MinIO instead
# of your own S3 endpoint:
#
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d
#
# MinIO's root account IS the application's S3_ACCESS_KEY / S3_SECRET_KEY
# pair, so the stack has exactly one object-storage credential pair. The base
# file already requires those credentials and this file enforces them again,
# so configuration fails closed when they are missing or empty. Never reuse
# production credentials in this development stack. MinIO requires its root
# user to be at least 3 and its password at least 8 characters long.
services:
  minio:
    # Archival images are for this loopback-only development stack, not production.
    image: docker.io/bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    container_name: atlas-minio
    ports:
      - "127.0.0.1:9000:9000"  # S3 API
      - "127.0.0.1:9001:9001"  # Web Console
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in your environment or .env (also the bundled MinIO root user)}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in your environment or .env (also the bundled MinIO root password)}
    volumes:
      - minio-data:/data
    entrypoint: ["/opt/bitnami/minio/bin/minio"]
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "http://127.0.0.1:9000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network

  minio-init:
    image: docker.io/bitnamilegacy/minio-client:2025.7.21-debian-12-r3@sha256:73bd39f7899a0cef12b8dd5df13aa93a3ed1aaa44236542442e9ac76819ac158
    container_name: atlas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in your environment or .env (also the bundled MinIO root user)}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in your environment or .env (also the bundled MinIO root password)}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set myminio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb myminio/atlas-files --ignore-existing
        mc anonymous set none myminio/atlas-files
        echo 'MinIO initialization complete'
    networks:
      - atlas-network

  # Overlay fragment: attaches the application to the bundled services only
  # when this file is loaded. The base docker-compose.yml has no MinIO
  # dependency, so external-S3 deployments neither start nor wait for one.
  atlas-ui:
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

networks:
  atlas-network:
    driver: bridge

volumes:
  minio-data:
