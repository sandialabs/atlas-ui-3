# The staging overlay for OpenShift. Identical to overlays/staging except that
# the bundled Redis, PostgreSQL and MinIO pods do not pin their image UIDs:
# the restricted-v2 SCC rejects a fixed runAsUser outside the project's range
# and assigns one itself (the images run under an arbitrary UID). The Atlas
# API pods pin no UID in either overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../staging

patches:
  - target: {kind: Deployment, name: atlas-redis}
    patch: |-
      - op: remove
        path: /spec/template/spec/securityContext/runAsUser
      - op: remove
        path: /spec/template/spec/securityContext/runAsGroup
  - target: {kind: StatefulSet, name: atlas-postgres}
    patch: |-
      - op: remove
        path: /spec/template/spec/securityContext/runAsUser
      - op: remove
        path: /spec/template/spec/securityContext/runAsGroup
      - op: remove
        path: /spec/template/spec/securityContext/fsGroup
  - target: {kind: Deployment, name: atlas-minio}
    patch: |-
      - op: remove
        path: /spec/template/spec/securityContext/runAsUser
      - op: remove
        path: /spec/template/spec/securityContext/fsGroup
