apiVersion: v1
kind: Service
metadata:
  name: atlas-api
  labels:
    app.kubernetes.io/name: atlas-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  # No sticky sessions: a reconnecting browser may land on any replica and
  # resumes its session from Redis (docs/admin/session-store.md). Keep the
  # ingress/Route free of cookie affinity as well.
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: atlas-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
